# fly.toml app configuration file for Collection.ma
# Generated with flyctl. App name will be assigned after `fly apps create`.
app = "collection-ma"

[build]
  # Remote builder on Fly.io (no local Docker needed)
  dockerfile = "Dockerfile"

primary_region = "fra"  # Paris or "ams" Amsterdam — nearest to Morocco

[vm]
  size = "shared-cpu-2x"   # 512MB RAM — FrankenPHP+Laravel needs >256MB

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://collection-ma.fly.dev"
  APP_LOCALE = "fr"
  APP_FALLBACK_LOCALE = "fr"

  DB_CONNECTION = "pgsql"
  # The rest of DB_* are injected automatically by `fly postgres attach`.

  BROADCAST_CONNECTION = "log"      # Websockets disabled for MVP
  QUEUE_CONNECTION = "database"
  CACHE_STORE = "database"
  SESSION_DRIVER = "database"

  FILESYSTEM_DISK = "local"
  PLATFORM_ADMIN_USER_ID = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  # HTTP readiness check on the internal port against Laravel's health route.
  # /up returns 200 (Laravel 11 health) — matches the app and avoids 308/SPA redirects.
  [[http_service.checks]]
    grace_period = "60s"
    interval = "10s"
    timeout = "5s"
    method = "GET"
    path = "/up"
    protocol = "http"
    tls_skip_verify = false

[[mounts]]
  source = "collection_ma_storage"
  destination = "/var/www/storage"
  initial_size = "2gb"

[deploy]
  # Run migrations on every deploy (idempotent)
  release_command = "php artisan migrate --force"